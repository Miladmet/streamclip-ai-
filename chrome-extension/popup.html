<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamClip AI Controls</title>
  <style>
    :root {
      --bg: #0e0c15;
      --card-bg: rgba(22, 19, 36, 0.75);
      --purple: #9146ff;
      --purple-hover: #a970ff;
      --border: rgba(145, 71, 255, 0.25);
      --text: #efeff1;
      --muted: #adadb8;
      --accent: #00f5ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 14px;
    }

    .pill {
      background: var(--purple);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .channel-tag {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }

    .btn-clip {
      width: 100%;
      background: linear-gradient(135deg, #9146ff 0%, #772ce8 100%);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(145, 70, 255, 0.4);
      margin-bottom: 12px;
      transition: all 0.15s ease;
    }

    .btn-clip:hover {
      background: linear-gradient(135deg, #a970ff 0%, #9146ff 100%);
      transform: translateY(-1px);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    select, input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--purple);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }

    .slider-row input[type="range"] {
      width: 60%;
      accent-color: var(--purple);
    }

    .btn-preset {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-preset:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .hook-suggestion {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 7px;
      font-size: 11px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hook-suggestion button {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .vault-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .vault-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    .vault-item a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>⚡ StreamClip AI</span>
      <span class="pill">PRO</span>
    </div>
    <span id="activeChannelLabel" class="channel-tag">@riotgames</span>
  </div>

  <button id="clipBtn" class="btn-clip">
    <span>⚡ Slice Last 30s (9:16 WebM)</span>
  </button>

  <div class="section-title">9:16 Video Layout</div>
  <div class="card">
    <select id="layoutSelect">
      <option value="split-right">Split: Top-Right Facecam + Gameplay</option>
      <option value="split-left">Split: Top-Left Facecam + Gameplay</option>
      <option value="center">Center Action Crop (Crosshairs)</option>
      <option value="blur">Pillarbox Blur Backdrop</option>
    </select>

    <div class="slider-group">
      <div class="slider-row">
        <span>Pan X</span>
        <input type="range" id="panX" min="0" max="100" value="50">
        <span id="panXVal">50%</span>
      </div>
      <div class="slider-row">
        <span>Pan Y</span>
        <input type="range" id="panY" min="0" max="100" value="50">
        <span id="panYVal">50%</span>
      </div>
      <div class="slider-row">
        <span>Zoom</span>
        <input type="range" id="zoom" min="10" max="24" value="10">
        <span id="zoomVal">1.0x</span>
      </div>
      <button id="fitTwitchBtn" class="btn-preset">📺 Fit Twitch Video Player</button>
    </div>
  </div>

  <div class="section-title">OpenAI Codex Viral Hooks</div>
  <div class="card">
    <input type="text" id="hookInput" value="WAIT TILL THE END 😱 #shorts">
    <div class="hook-suggestion">
      <span id="titleSug">THE MOST UNREAL CLUTCH EVER 🔥 #twitch</span>
      <button id="copyTitleBtn">Copy</button>
    </div>
  </div>

  <div class="section-title">Session Clip Vault</div>
  <div class="card">
    <div id="vaultList" class="vault-list">
      <div style="font-size:11px; color:var(--muted); text-align:center; padding:6px;">No clips captured yet this session.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
